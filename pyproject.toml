[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-edge-specsim"
version = "0.1.0"
description = "Qwen/vLLM edge speculative-decoding research simulator"
requires-python = ">=3.10"
dependencies = [
	"accelerate>=0.34,<2",
	"datasets>=3,<5",
	"huggingface-hub>=0.30,<1",
	"numpy>=1.26,<3",
	"pandas>=2.2,<3",
	"PyYAML>=6,<7",
	"torch>=2.4",
	"tqdm>=4.66,<5",
	"transformers>=4.51,<4.57",
	"vllm>=0.9,<0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
