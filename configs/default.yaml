decoding:
  mode: greedy
  temperature: 0.0

models:
  target: Qwen/Qwen2.5-7B-Instruct
  draft: Qwen/Qwen2.5-1.5B-Instruct
  # Add or remove entries here to match the number of draft GPUs on your node.
  draft_devices: [cuda:1, cuda:2, cuda:3]
  target_gpu_memory_utilization: 0.88
  target_max_model_len: 8192
  target_dtype: auto
  target_enforce_eager: false
  # vLLM caches reusable target-prefix KV blocks across verification rounds.
  target_enable_prefix_caching: true

dataset:
  # gsm8k | math | cnn_dailymail
  name: gsm8k
  split: test
  num_questions: 12
  shuffle: true
  seed: 42
  shuffle_buffer: 1000

  # Output budget per question.
  max_new_tokens: 256

  # Used only when name=math:
  # all | algebra | counting_and_probability | geometry |
  # intermediate_algebra | number_theory | prealgebra | precalculus
  math_subject: all

  # Used only when name=cnn_dailymail. Long articles are truncated by chars
  # before tokenization so small test runs do not exceed model context length.
  max_article_chars: 12000

simulation:
  seed: 42
  num_clients: 6
  # simulation: use real draft tokens but contention-free virtual edge latency profiles.
  # shared_gpu_emulation: many clients time-share the configured draft_devices and
  # draft latency uses measured wall-clock.
  draft_execution_mode: simulation
  gamma_max: 4
  controller_v: 10.0
  min_interactivity_tps: 8.0
  server_price_scale: 0.02
  output_csv: results/rounds.csv

experiment:
  warmup_seconds: 30
  measurement_seconds: 300
  seeds: [1, 2, 3, 4, 5]

controller:
  policy: adaptive_ucb
  gamma_choices: [0, 1, 2, 4, 6, 8]
  fixed_gamma: 4
  min_exploration_rounds: 4
  exploration_gamma: 1
  exploration_epsilon: 0.05
  V: 100.0
  min_interactivity_tps: 8.0
  server_price_scale: 0.02
  verifier_price_lambda: 1.0
  draft_latency_weight: 0.002
  uplink_latency_weight: 0.002
  learning:
    mode: bernstein_censored
    alpha_prior_success: 1.0
    alpha_prior_failure: 1.0
    confidence_delta: 0.05
    alpha_min: 1.0e-6
    alpha_max: 0.999999
    discount: 0.98
    ucb_coefficient: 1.5
    window_size: 64

control:
  slot_ms: 100.0

verification_batching:
  scheduler: fcfs
  max_batch_size: 16
  batch_wait_ms: 5.0
  # fixed: use verify_token_budget directly
  # roofline_knee: cap per-frame verifier tokens by the profiled Gamma^dagger lookup
  budget_mode: fixed
  verify_token_budget: 80
  target_replication_factor: 1
  roofline_summary_path: results/target_profile_summary.json
  utility_lambda: 0.25

outer_optimization:
  objective:
    # Upper-level objective over xi after solving the inner runtime frontier problem.
    # auc_trapezoidal | normalized_auc | headline_goodput_tps
    metric: auc_trapezoidal
    # If omitted, optimize_configuration.py normalizes by max(interactivity_targets).
    # auc_normalizer_x: 6.0
  target_model_choices:
    - Qwen/Qwen2.5-7B-Instruct
  draft_model_choices:
    - Qwen/Qwen2.5-0.5B-Instruct
    - Qwen/Qwen2.5-1.5B-Instruct
  draft_placements:
    - edge_device
    - shared_gpu_pool
  draft_pool_size_choices: [1, 2, 3]
  target_replication_choices: [1]
  model_catalog:
    Qwen/Qwen2.5-7B-Instruct:
      memory_gb: 16.0
    Qwen/Qwen2.5-1.5B-Instruct:
      memory_gb: 4.0
    Qwen/Qwen2.5-0.5B-Instruct:
      memory_gb: 2.0
  budgets:
    device_memory_budget_gb: 8.0
    server_gpu_memory_budget_gb: 24.0
    available_target_gpus: 1
    available_draft_gpus: 3

clients:
  channel_model: iid_block_fading
  rtt_ms_range: [15.0, 100.0]
  uplink_mbps_range: [5.0, 50.0]
  downlink_mbps_range: [10.0, 100.0]
  uplink_base_snr_db_range: [8.0, 18.0]
  downlink_base_snr_db_range: [10.0, 20.0]
  uplink_snr_jitter_db_range: [1.0, 4.0]
  downlink_snr_jitter_db_range: [1.0, 4.0]
  snr_block_duration_ms_range: [100.0, 100.0]
  snr_period_ms_range: [500.0, 3000.0]
  packet_loss_range: [0.0, 0.0]
  draft_tokens_per_second_range: [20.0, 60.0]
  draft_fixed_latency_ms_range: [5.0, 20.0]
  draft_speed_multiplier_range: [0.7, 1.5]
  shared_wireless:
    total_uplink_bandwidth_mhz: 40.0
    total_downlink_bandwidth_mhz: 80.0
    uplink_allocator: square-root
    downlink_allocator: queue-weighted
  client_classes:
    fast:
      probability: 0.25
      draft_slowdown: 0.7
      wireless_weight: 1.2
      channel_model: iid_block_fading
      rtt_ms: [10.0, 30.0]
      uplink_mbps: [50.0, 100.0]
      downlink_mbps: [80.0, 150.0]
      uplink_base_snr_db: [16.0, 24.0]
      downlink_base_snr_db: [18.0, 26.0]
      uplink_snr_jitter_db: [0.5, 2.0]
      downlink_snr_jitter_db: [0.5, 2.0]
      snr_block_duration_ms: [100.0, 100.0]
      snr_period_ms: [800.0, 2000.0]
    medium:
      probability: 0.50
      draft_slowdown: 1.0
      wireless_weight: 1.0
      channel_model: iid_block_fading
      rtt_ms: [30.0, 80.0]
      uplink_mbps: [10.0, 50.0]
      downlink_mbps: [20.0, 80.0]
      uplink_base_snr_db: [10.0, 18.0]
      downlink_base_snr_db: [12.0, 20.0]
      uplink_snr_jitter_db: [1.0, 3.0]
      downlink_snr_jitter_db: [1.0, 3.0]
      snr_block_duration_ms: [100.0, 100.0]
      snr_period_ms: [700.0, 2500.0]
    slow:
      probability: 0.25
      draft_slowdown: 1.8
      wireless_weight: 0.8
      channel_model: iid_block_fading
      rtt_ms: [80.0, 200.0]
      uplink_mbps: [2.0, 10.0]
      downlink_mbps: [5.0, 20.0]
      uplink_base_snr_db: [3.0, 10.0]
      downlink_base_snr_db: [5.0, 12.0]
      uplink_snr_jitter_db: [2.0, 5.0]
      downlink_snr_jitter_db: [2.0, 5.0]
      snr_block_duration_ms: [100.0, 100.0]
      snr_period_ms: [600.0, 2200.0]
