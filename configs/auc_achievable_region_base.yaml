decoding:
  mode: greedy
  temperature: 0.0

models:
  target: Qwen/Qwen2.5-7B-Instruct
  draft: Qwen/Qwen2.5-1.5B-Instruct
  draft_devices: [cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]
  target_gpu_memory_utilization: 0.65
  target_max_model_len: 4096
  target_dtype: auto
  target_enforce_eager: false
  # Known vLLM bug (issues #8268, #7003, #13105): enable_prefix_caching=True
  # + prompt_logprobs crashes get_logprobs with an AssertionError.
  target_enable_prefix_caching: false

# Global/default dataset -- unused directly since every client_class below
# declares its own dataset override, but kept small since load_samples()
# is still called once at simulator init for the (empty) default group.
dataset:
  name: gsm8k
  split: test
  num_questions: 5
  shuffle: true
  seed: 42
  shuffle_buffer: 1000
  max_new_tokens: 96
  math_subject: all
  max_article_chars: 12000

simulation:
  seed: 42   # overridden per run
  num_clients: 21
  # 3 clients share each of the 7 draft GPUs -- real contention, so use
  # measured wall-clock draft latency for the virtual clock instead of a
  # contention-free profile.
  draft_execution_mode: shared_gpu_emulation
  gamma_max: 4
  controller_v: 100.0
  # AUC_ACHIEVABLE_REGION_DIAGNOSTIC.md Section 6: x_requirement is fixed
  # at a benign, non-binding value for this diagnostic -- it is NOT the
  # swept variable here. The independent variable is
  # clients.diagnostic_priority_multiplier, overridden per run by the
  # driver script.
  min_interactivity_tps: 0.1
  server_price_scale: 0.02
  output_csv: results/auc_achievable_region/raw/PLACEHOLDER.csv

experiment:
  warmup_seconds: 0
  measurement_seconds: null
  seeds: [1]

controller:
  policy: adaptive_index
  gamma_choices: [0, 1, 2, 3, 4]
  fixed_gamma: 4
  min_exploration_rounds: 2
  exploration_gamma: 1
  exploration_epsilon: 0.05
  V: 100.0
  min_interactivity_tps: 0.1
  server_price_scale: 0.02
  verifier_price_lambda: 1.0
  draft_latency_weight: 0.0
  uplink_latency_weight: 0.0
  fixed_slo_ms: 400.0
  gelato_v: 100.0
  gelato_draft_power_mw: 500.0
  gelato_uplink_power_mw: 200.0
  gelato_energy_budget_mj: 200.0
  learning:
    mode: bernstein_censored
    alpha_prior_success: 1.0
    alpha_prior_failure: 1.0
    confidence_delta: 0.05
    alpha_min: 1.0e-6
    alpha_max: 0.999999
    discount: 0.98
    ucb_coefficient: 1.5
    window_size: 64

control:
  slot_ms: 100.0

# Same scarce/contended batching config as the acceptance-heterogeneity
# diagnostic (Section 10.2/Section 11 of AUC_FRONTIER_DIAGNOSTIC_REPORT.md)
# -- unchanged here, per Section 3's "do not change deployment parameters
# while sweeping priority".
verification_batching:
  scheduler: weighted_utility
  max_batch_size: 21
  batch_wait_ms: 150.0
  budget_mode: fixed
  verify_token_budget: 6
  target_replication_factor: 1
  utility_lambda: 0.25

clients:
  channel_model: iid_block_fading
  rtt_ms_range: [15.0, 100.0]
  uplink_mbps_range: [5.0, 50.0]
  downlink_mbps_range: [10.0, 100.0]
  uplink_base_snr_db_range: [8.0, 18.0]
  downlink_base_snr_db_range: [10.0, 20.0]
  uplink_snr_jitter_db_range: [1.0, 4.0]
  downlink_snr_jitter_db_range: [1.0, 4.0]
  snr_block_duration_ms_range: [100.0, 100.0]
  snr_period_ms_range: [500.0, 3000.0]
  packet_loss_range: [0.0, 0.0]
  draft_tokens_per_second_range: [20.0, 60.0]
  draft_fixed_latency_ms_range: [5.0, 20.0]
  draft_speed_multiplier_range: [0.7, 1.5]
  shared_wireless:
    total_uplink_bandwidth_mhz: 40.0
    total_downlink_bandwidth_mhz: 80.0
    uplink_allocator: square-root
    downlink_allocator: queue-weighted
  # AUC_ACHIEVABLE_REGION_DIAGNOSTIC.md Section 4: diagnostic-only class
  # priority multiplier m_{c(i)}, applied to the server-side verification
  # weight w_i = m_{c(i)} * (V + Z_i) (see simulator.py's submit() call).
  # Overridden per run by scripts/run_auc_achievable_region.py -- the
  # values below are the neutral (m=1 for all classes) baseline.
  diagnostic_priority_multiplier:
    easy_gsm8k: 1.0
    medium_cnn_summarize: 1.0
    hard_math: 1.0
  # Acceptance heterogeneity via real prompt/dataset choice (not a fake
  # Bernoulli alpha): three equal-size groups of 7 clients each, all
  # sharing the SAME latency/bandwidth ranges above (no draft_slowdown /
  # rtt / bandwidth overrides here) so the only difference between groups
  # is which real dataset -- and therefore which real measured
  # draft/target acceptance rate -- they get. max_new_tokens is pinned to
  # 96 for all three so round length doesn't confound the comparison.
  client_classes:
    easy_gsm8k:
      probability: 0.3333
      dataset:
        name: gsm8k
        split: test
        num_questions: 35   # 7 clients x 5 questions
        shuffle: true
        seed: 42
        shuffle_buffer: 1000
        max_new_tokens: 96
    medium_cnn_summarize:
      probability: 0.3333
      dataset:
        name: cnn_dailymail
        split: test
        num_questions: 35
        streaming: false
        max_article_chars: 12000
        max_new_tokens: 96
    hard_math:
      probability: 0.3334
      dataset:
        name: math
        split: test
        num_questions: 35
        math_subject: all
        streaming: false
        max_new_tokens: 96
