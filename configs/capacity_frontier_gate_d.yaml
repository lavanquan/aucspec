# CAPACITY_AWARE_FRAMEWORK_CODEX_IMPLEMENTATION.md Section 13.
# Paper-oriented final config -- do NOT overwrite capacity_frontier_base.yaml
# (kept as the historical/quick/pilot config).

decoding:
  mode: greedy
  temperature: 0.0

models:
  target: Qwen/Qwen2.5-7B-Instruct
  draft: Qwen/Qwen2.5-1.5B-Instruct
  draft_devices: [cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]
  target_gpu_memory_utilization: 0.70
  target_max_model_len: 4096
  target_dtype: auto
  target_enforce_eager: false
  target_enable_prefix_caching: false

dataset:
  name: gsm8k
  split: test
  num_questions: 300
  shuffle: true
  seed: 42
  shuffle_buffer: 1000
  max_new_tokens: 96

simulation:
  seed: 42                       # overridden per seed
  num_clients: 8                 # overridden by the capacity-search driver (= candidate N)
  draft_execution_mode: shared_gpu_emulation
  gamma_max: 4
  controller_v: 50.0
  min_interactivity_tps: 2.0     # overridden per x
  server_price_scale: 0.02
  nested_population: true
  questions_per_client: 40
  population_n_max: 30           # N_ref; catalog holds n_max * qpc prompts
  output_csv: results/capacity_frontier/PLACEHOLDER/raw/PLACEHOLDER.csv

experiment:
  warmup_seconds: 30
  measurement_seconds: null      # overridden per candidate
  seeds: [1]

controller:
  policy: capacity_dpp
  gamma_choices: [0, 1, 2, 3, 4]
  fixed_gamma: 4
  min_exploration_rounds: 2
  exploration_gamma: 1
  exploration_epsilon: 0.05
  V: 50.0                        # fixed; NOT the frontier axis (Section 0 rule 3)
  min_interactivity_tps: 2.0     # overridden per x
  server_price_scale: 0.02
  verifier_price_lambda: 1.0
  draft_latency_weight: 0.0
  uplink_latency_weight: 0.0
  use_virtual_queues: true
  learning:
    mode: bernstein_censored
    alpha_prior_success: 1.0
    alpha_prior_failure: 1.0
    confidence_delta: 0.05
    alpha_min: 1.0e-6
    alpha_max: 0.999999
    discount: 0.98
    ucb_coefficient: 1.5
    window_size: 64

control:
  slot_ms: 100.0

verification_batching:
  scheduler: capacity_knapsack   # Section 6: queue-priced capacity_dpp value
  max_batch_size: 32
  batch_wait_ms: 150.0
  budget_mode: fixed
  verify_token_budget: 10
  target_replication_factor: 1
  utility_lambda: 0.25

clients:
  channel_model: iid_block_fading
  rtt_ms_range: [15.0, 100.0]
  uplink_mbps_range: [5.0, 50.0]
  downlink_mbps_range: [10.0, 100.0]
  uplink_base_snr_db_range: [8.0, 18.0]
  downlink_base_snr_db_range: [10.0, 20.0]
  uplink_snr_jitter_db_range: [1.0, 4.0]
  downlink_snr_jitter_db_range: [1.0, 4.0]
  snr_block_duration_ms_range: [100.0, 100.0]
  snr_period_ms_range: [500.0, 3000.0]
  packet_loss_range: [0.0, 0.0]
  draft_tokens_per_second_range: [20.0, 60.0]
  draft_fixed_latency_ms_range: [5.0, 20.0]
  draft_speed_multiplier_range: [0.7, 1.5]
  shared_wireless:
    total_uplink_bandwidth_mhz: 40.0
    total_downlink_bandwidth_mhz: 80.0
    uplink_allocator: square-root
    downlink_allocator: queue-weighted

capacity_search:
  x_L: 2.0
  x_U: 6.0
  x_grid_final: [3.0, 4.5, 6.0]
  n_ref: 30
  n_search_cap: 30
  n_lo_feasible: 1
  confidence_delta: 0.05
  initial_seeds: 3
  max_seeds: 7
  min_final_seeds: 5
  warmup_seconds: 30
  measurement_seconds_final: 240
  max_measurement_seconds: 480
  x_tolerance_tps: 0.10
  # kept only so --pilot (which reads the SAME capacity_search block from
  # this file if pointed at it) has fallbacks; --pilot normally reads
  # capacity_frontier_base.yaml instead.
  x_grid_pilot: [2.0, 4.0, 6.0]
  rate_tolerance_fraction: 0.05
  queue_slope_tolerance: 0.02
  measurement_seconds_pilot: 90
